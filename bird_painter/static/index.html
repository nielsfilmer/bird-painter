<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bird-painter</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  :root {
    --ink: #4a3f2e;
    --ink-dim: #8d8065;
  }
  html, body { height: 100%; }
  body {
    /* The paper the collage lives on — same aged-cream world as the
       paintings, with soft mottling so it reads as one sheet. */
    background:
      radial-gradient(ellipse at 22% 18%, rgba(122, 96, 59, 0.10), transparent 55%),
      radial-gradient(ellipse at 78% 76%, rgba(122, 96, 59, 0.12), transparent 50%),
      radial-gradient(ellipse at 65% 25%, rgba(255, 252, 240, 0.55), transparent 60%),
      radial-gradient(ellipse at 50% 50%, #f4edda 0%, #ece1c6 62%, #ddcda6 100%);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    overflow: hidden;
  }
  /* Grain overlay: subtle paper tooth over everything, plates included. */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.5;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix values='0 0 0 0 0.42 0 0 0 0 0.36 0 0 0 0 0.25 0 0 0 0.05 0'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
  }
  /* Same paper as body: position:fixed makes #wall a stacking context, so
     the plates' multiply blends against #wall's own backdrop — it must carry
     the paper itself or the blend sees only transparency (halo bug). */
  #wall { position: fixed; inset: 0; background: inherit; }
  .plate {
    position: absolute;
    left: 50%;
    top: 50%;
    opacity: 0;
    /* Blend the painting into the paper. On the figure itself — not the img —
       because the figure's transform creates a stacking context that would
       isolate a child's blend from the page. */
    mix-blend-mode: multiply;
    transition:
      opacity 2.2s ease,
      transform 1.6s cubic-bezier(0.22, 1, 0.36, 1),
      width 1.6s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .plate.shown { opacity: 1; }
  .plate.dying { opacity: 0; }
  /* Birds with an archived detection clip replay it on click. */
  .plate.has-audio { cursor: pointer; }
  .plate.playing img { animation: sing 1.1s ease-in-out infinite; }
  @keyframes sing {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.02); }
  }
  .plate img {
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    display: block;
    /* Feather the painting's edges away into the paper — no hard rectangle.
       (The melt itself is the figure-level multiply above.) Birds are painted
       on plain white, so multiply drops the ground and leaves a cutout. */
    -webkit-mask-image: radial-gradient(ellipse 58% 58% at 50% 50%, black 72%, transparent 96%);
    mask-image: radial-gradient(ellipse 58% 58% at 50% 50%, black 72%, transparent 96%);
  }
  /* ---- ?style=panel: the e-paper frame's layout, on a screen ------------
     The table model is read from across a room, like the frame, and the
     owner wants the birds placed exactly as the frame places them (#138).
     The plan comes from /api/layout — the same function that draws
     /wall.png?style=panel — so nothing here decides WHERE anything goes; it
     only draws what it is told. Sizes below are set from the plan in px,
     which is why the vmin-based rules above are overridden rather than
     reused: the plan's vmin is the frame's (layout height, not viewport
     height), and the type is fixed-size by decision (PLAN.md 2026-08-13). */
  body.panel #header { display: none; } /* the sheet is the header */
  body.panel .plate .cell {
    position: relative;
    overflow: hidden;
    width: 100%;
    transition: height 1.6s cubic-bezier(0.22, 1, 0.36, 1);
    /* The FRAME's feather, not the wall's: render._feather_mask(soft=False)
       widens the ellipse to 0.80 because the bird's ink is fitted to the
       cell and the wall's 0.58 ellipse would clip a heron's beak and feet
       (QA on #139 measured alpha 0.41 at the cell's edge against the frame's
       1.0). Same 72%→96% fade. */
    -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 72%, transparent 96%);
    mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 72%, transparent 96%);
  }
  body.panel .plate .cell img {
    /* The image is /images/<file>?bare=1 — already the bird's own ink with
       the plate's ground keyed to alpha, exactly what the frame pastes. Its
       aspect IS the cell's (the plan shaped the cell from the same ink
       bounds), so contain fills it edge to edge with no client-side crop. */
    position: static;
    width: 100%;
    height: 100%;
    aspect-ratio: auto;
    object-fit: contain;
    -webkit-mask-image: none;
    mask-image: none;
  }
  /* The "sing" pulse on the cell, not the img: the img is clipped by the
     cell's overflow, and scaling a cropped img about its own centre moved
     the bird (QA + review on #139). */
  body.panel .plate.playing img { animation: none; }
  body.panel .plate.playing .cell { animation: sing 1.1s ease-in-out infinite; }
  body.panel .plate figcaption {
    /* The frame draws each caption as ONE line centred under the bird and
       reserves its measured width in the plan's footprint, so neighbours
       can't collide. Wrapping here would put the lettering somewhere the
       plan didn't account for — so: never wrap, centre a max-content box on
       the cell, and let it overhang the cell on both sides as the frame's
       does. (The plate is exactly the cell's width, so a plain centred
       block would overflow to the right only.) */
    margin: var(--panel-gap, 0px) 0 0;
    position: relative;
    left: 50%;
    transform: translateX(-50%);
    width: max-content;
    white-space: nowrap;
    overflow-wrap: normal;
  }
  body.panel .plate .species {
    /* The frame sets the species line in caps with tracking. */
    text-transform: uppercase;
    font-variant: normal;
    font-size: var(--panel-species, 12px);
    letter-spacing: var(--panel-tracking, 0.05em);
  }
  body.panel .plate .heard {
    /* Deliberately the larger of the two on the panel (owner, 2026-08-07). */
    font-size: var(--panel-heard, 14px);
  }

  /* Per-bird label, added programmatically (never baked into the image). */
  .plate figcaption {
    text-align: center;
    margin-top: -0.4vmin;
    line-height: 1.15;
    /* A species name longer than its plate is wide used to paint straight out
       of the box — and because the box never grows, neither the layout's
       on-screen clamp nor any getBoundingClientRect check could see it. Break
       inside the word instead: an ugly wrap is measurable, an overhang is not. */
    overflow-wrap: anywhere;
  }
  /* --caption-scale multiplies BOTH the fluid size and the clamp rails. The
     rails are the point: on a 720x1280 panel 1.05vmin lands under the floor
     and on 1200x1920 it lands over the ceiling, so on both table-model panels
     the type is pinned to a rail and scaling only the middle term would do
     nothing. Set from ?caption= — see the script below. Default 1 = unchanged. */
  .plate .species {
    font-variant: small-caps;
    letter-spacing: 0.05em;
    font-size: clamp(
      calc(8px * var(--caption-scale, 1)),
      calc(1.05vmin * var(--caption-scale, 1)),
      calc(12px * var(--caption-scale, 1))
    );
    color: var(--ink);
  }
  .plate .heard {
    font-style: italic;
    font-size: clamp(
      calc(7px * var(--caption-scale, 1)),
      calc(0.85vmin * var(--caption-scale, 1)),
      calc(10px * var(--caption-scale, 1))
    );
    color: #6b5e45;
    margin-top: 0.05vmin;
  }
  /* Title chrome at the top of the wall. */
  #header {
    position: fixed;
    top: 4.5vmin;
    left: 0;
    right: 0;
    z-index: 1;
    text-align: center;
    color: var(--ink);
    pointer-events: none;
  }
  #header .eyebrow {
    font-style: italic;
    font-size: clamp(12px, 1.7vmin, 19px);
    color: var(--ink-dim);
    letter-spacing: 0.02em;
  }
  #header .title {
    font-size: clamp(22px, 4.2vmin, 52px);
    letter-spacing: 0.22em;
    font-variant: small-caps;
    margin-top: 0.4vmin;
  }
  #empty {
    position: fixed;
    inset: 0;
    z-index: 1; /* above #wall, which now paints an opaque paper background */
    display: grid;
    place-items: center;
    color: var(--ink-dim);
    font-style: italic;
    font-size: clamp(16px, 2.6vmin, 24px);
    letter-spacing: 0.12em;
    pointer-events: none;
    transition: opacity 1.8s ease;
  }
  #empty.hidden { opacity: 0; }
  /* Archive: a quiet corner button + a full-screen overlay. Browser wall
     only — the server-rendered /wall.png never contains page chrome. */
  #archive-button {
    position: fixed;
    right: 2vmin;
    bottom: 1.6vmin;
    z-index: 3;
    font-style: italic;
    font-size: clamp(
      calc(11px * var(--caption-scale, 1)),
      calc(1.4vmin * var(--caption-scale, 1)),
      calc(15px * var(--caption-scale, 1))
    );
    color: var(--ink-dim);
    background: none;
    border: none;
    font-family: inherit;
    letter-spacing: 0.06em;
    cursor: pointer;
    opacity: 0.75;
  }
  #archive-button:hover { opacity: 1; text-decoration: underline; }
  #archive {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: inherit;
    overflow-y: auto;
    padding: 5vmin 6vmin;
    display: none;
  }
  #archive.open { display: block; }
  #archive h2 {
    font-variant: small-caps;
    letter-spacing: 0.18em;
    font-weight: normal;
    font-size: clamp(
      calc(18px * var(--caption-scale, 1)),
      calc(3vmin * var(--caption-scale, 1)),
      calc(34px * var(--caption-scale, 1))
    );
    text-align: center;
    margin-bottom: 3vmin;
  }
  #archive-close {
    position: fixed;
    top: 2vmin;
    right: 2.5vmin;
    z-index: 11;
    background: none;
    border: none;
    font-family: inherit;
    font-size: clamp(20px, 3vmin, 30px);
    color: var(--ink-dim);
    cursor: pointer;
  }
  #archive-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 3vmin 2vmin;
  }
  .arch-card { text-align: center; }
  .arch-card img {
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    mix-blend-mode: multiply;
    -webkit-mask-image: radial-gradient(ellipse 58% 58% at 50% 50%, black 72%, transparent 96%);
    mask-image: radial-gradient(ellipse 58% 58% at 50% 50%, black 72%, transparent 96%);
  }
  .arch-card.has-audio { cursor: pointer; }
  .arch-card.playing img { animation: sing 1.1s ease-in-out infinite; }
  .arch-card .species {
    font-variant: small-caps;
    letter-spacing: 0.05em;
    font-size: clamp(
      calc(9px * var(--caption-scale, 1)),
      calc(1.1vmin * var(--caption-scale, 1)),
      calc(13px * var(--caption-scale, 1))
    );
  }
  .arch-card .when {
    font-style: italic;
    font-size: clamp(
      calc(8px * var(--caption-scale, 1)),
      calc(0.95vmin * var(--caption-scale, 1)),
      calc(11px * var(--caption-scale, 1))
    );
    color: #6b5e45;
  }
  #archive-more {
    display: block;
    margin: 4vmin auto 1vmin;
    background: none;
    border: 1px solid var(--ink-dim);
    font-family: inherit;
    font-style: italic;
    color: var(--ink);
    /* No font-size rule at all until now, so it inherited 13.3px and stayed
       there while every other archive label scaled — a "more" button a kiosk
       viewer can't read is a dead end in the only navigation this page has. */
    font-size: clamp(
      calc(11px * var(--caption-scale, 1)),
      calc(1.4vmin * var(--caption-scale, 1)),
      calc(15px * var(--caption-scale, 1))
    );
    padding: 0.8vmin 2.4vmin;
    cursor: pointer;
  }
  #archive-more.done { display: none; }
</style>
</head>
<body>
<div id="header">
  <div class="eyebrow">birds outside</div>
  <div class="title">heard recently</div>
</div>
<div id="empty">listening…</div>
<div id="wall"></div>
<button id="archive-button" title="everything heard this month">archive</button>
<div id="archive">
  <button id="archive-close" title="back to the wall">&times;</button>
  <h2>heard this month</h2>
  <div id="archive-grid"></div>
  <button id="archive-more">more</button>
</div>
<script type="module">
import { computeCollage, normalizePanelOpts } from "/layout.js";

const wall = document.getElementById("wall");
const empty = document.getElementById("empty");
const plates = new Map(); // file -> element
const FADE_MS = 2300;

// Panel tuning, from the query string — the kiosk's URL is where a table-model
// unit is configured (slice #120), so this needs no server surface and no
// restart to try a value. Both default to the desktop wall's existing look:
//
//   ?spread=0.75   widen the collage to claim at least 75% of the viewport.
//                  On a tall portrait panel the widen-to-fit rule stops early
//                  and leaves ~21% cream margin each side; this sets a floor.
//   ?caption=1.6   enlarge the lettering. Both panels pin the caption to a
//                  clamp rail — 8px on the 7", 12px on the 10" — around 1mm of
//                  glyph, which a wall read from across a room cannot carry.
//
// computeCollage clamps both. It grows the per-plate caption reserve with the
// scale, but that reserve is linear and a wrapped caption is not, so it holds
// on the panels this is for and not on a small-vmin viewport — see the KNOWN
// LIMIT note in layout.js, and #136.
const params = new URLSearchParams(location.search);
const panelOpts = normalizePanelOpts({
  spread: params.get("spread"),
  captionScale: params.get("caption"),
});
// ?style=panel — place the birds exactly as the e-paper frame does (#138).
// The layout is fetched from /api/layout rather than computed here, because
// the frame's placement depends on measurements only the server can make;
// see layoutPanel(). ?spread= and ?caption= are the spiral's knobs: in this
// mode the plan carries its own fixed-size type, and --caption-scale is left
// at 1 so the archive overlay doesn't scale either (QA on #139: it did).
const panelStyle = params.get("style") === "panel";
if (panelStyle) document.body.classList.add("panel");
else document.documentElement.style.setProperty("--caption-scale", String(panelOpts.captionScale));

function heardText(bornAt) {
  // A fixed clock time, not "x min ago": the e-ink frame only refreshes every
  // few minutes, so a relative label would be stale between draws. The
  // timestamp is correct whenever the panel last rendered.
  const t = new Date(bornAt * 1000);
  // hourCycle h23 → 00–23 (avoids the 24:00 midnight quirk some locales show).
  return `heard at ${t.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hourCycle: "h23" })}`;
}

// Apply the pure layout (bird_painter/static/layout.js) to the plate elements.
// The maths — spiral placement, no-overlap, crowding scale — lives in that
// module so `node --test` can guard it (layout.test.js).
let liveOrder = []; // files, newest first — set by refresh()

// ---- panel mode: apply the frame's plan ----------------------------------
let lastPlanKey = null;  // viewport + live set the current plates were placed for
let planInFlight = false;
async function layoutPanel() {
  const files = liveOrder.filter(f => plates.has(f));
  const [W, H] = [wall.clientWidth, wall.clientHeight];
  if (W <= 0 || H <= 0) return;
  // The plan is deterministic per live set and viewport, so only ask when
  // one of them changed — the wall polls every few seconds, and the recorder
  // measures every live plate to answer.
  const key = `${W}x${H}|${files.join("|")}`;
  if (key === lastPlanKey || planInFlight) return;
  planInFlight = true;
  let plan;
  try {
    const res = await fetch(`/api/layout?style=panel&width=${W}&height=${H}`);
    if (!res.ok) return;
    plan = await res.json();
  } catch { return; } // recorder briefly away; keep the current wall
  finally { planInFlight = false; }
  // A bird may have arrived or left, or the window changed shape, while we
  // waited: a plan for the old set would miss one or place a ghost, and a
  // plan for the old size lands 190px off (QA on #139). Let the next poll ask.
  const nowKey = `${wall.clientWidth}x${wall.clientHeight}|${liveOrder.filter(f => plates.has(f)).join("|")}`;
  if (nowKey !== key) return;
  // An empty plan is the planner declining (a viewport too small for one
  // plate): don't remember it as done, or the wall stays frozen at that size.
  if (!plan.placements.length) return;

  const root = document.documentElement.style;
  root.setProperty("--panel-species", `${plan.species_size}px`);
  root.setProperty("--panel-heard", `${plan.heard_size}px`);
  root.setProperty("--panel-gap", `${plan.caption_gap.toFixed(1)}px`);
  root.setProperty("--panel-tracking", `${plan.tracking.toFixed(2)}px`);
  for (const p of plan.placements) {
    const el = plates.get(p.file);
    if (!el) continue;
    // Plan sizes are in the plan's vmin, in px here — the frame draws them
    // the same way. x/y are the IMAGE's centre relative to the wall's centre
    // (the caption hangs below it), so the figure's top-left is the centre
    // less half the cell.
    const w = p.size_vmin * plan.vmin, h = p.height_vmin * plan.vmin;
    el.style.width = `${w.toFixed(1)}px`;
    el.querySelector(".cell").style.height = `${h.toFixed(1)}px`;
    el.style.transform =
      `translate(-50%, 0) translate(${p.x.toFixed(1)}px, ${(p.y - h / 2).toFixed(1)}px)`;
    el.style.zIndex = String(p.z);
    // A new plate is only shown once it has a place — before that it would
    // paint as a bare caption at dead centre until the plan landed.
    el.classList.add("shown");
  }
  lastPlanKey = key; // committed only once the plan has actually been applied
}

function layoutAll() {
  if (panelStyle) { layoutPanel(); return; }
  const header = document.getElementById("header");
  const bandTop = header ? header.getBoundingClientRect().bottom + 8 : 0;
  const files = liveOrder.filter(f => plates.has(f));
  const placements = computeCollage(files, wall.clientWidth, wall.clientHeight, bandTop, panelOpts);
  for (const p of placements) {
    const el = plates.get(p.file);
    if (!el) continue;
    el.style.width = `${p.sizeVmin.toFixed(1)}vmin`;
    el.style.transform =
      `translate(-50%, -50%) translate(${p.x.toFixed(1)}px, ${p.y.toFixed(1)}px)`;
    el.style.zIndex = String(p.z);
  }
}

// Re-layout when the viewport changes shape.
let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(layoutAll, 150);
});

let nowPlaying = null; // one clip at a time; clicking another stops the first

function playClip(fig, audioFile) {
  if (nowPlaying) {
    nowPlaying.audio.pause();
    nowPlaying.fig.classList.remove("playing");
    const wasSame = nowPlaying.fig === fig;
    nowPlaying = null;
    if (wasSame) return; // second click on the same bird = stop
  }
  const audio = new Audio(`/audio/${encodeURIComponent(audioFile)}`);
  nowPlaying = { audio, fig };
  fig.classList.add("playing");
  const done = () => {
    fig.classList.remove("playing");
    if (nowPlaying && nowPlaying.fig === fig) nowPlaying = null;
  };
  audio.addEventListener("ended", done);
  audio.addEventListener("error", done);
  audio.play().catch(done); // autoplay policy or a 404 — fail quiet
}

function makePlate(p) {
  const fig = document.createElement("figure");
  fig.className = "plate";
  fig.dataset.file = p.file;
  if (p.audio) {
    // Replay the actual sound this painting was made from.
    fig.classList.add("has-audio");
    fig.addEventListener("click", () => playClip(fig, p.audio));
    fig.title = "click to hear the song that painted this bird";
  }
  const img = document.createElement("img");
  img.src = `/images/${encodeURIComponent(p.file)}`;
  img.alt = `Painting of ${p.species_common}`;
  // Panel mode shows the bird as the frame pastes it — /images/<file>?bare=1
  // is the ink crop with the ground keyed out — inside a cell the plan
  // shaped to that ink. The spiral shows the whole plate and needs no wrapper.
  let picture = img;
  if (panelStyle) {
    img.src += "?bare=1";
    picture = document.createElement("div");
    picture.className = "cell";
    picture.append(img);
  }
  const caption = document.createElement("figcaption");
  const species = document.createElement("div");
  species.className = "species";
  species.textContent = p.species_common;
  const heard = document.createElement("div");
  heard.className = "heard";
  heard.textContent = heardText(p.born_at);
  caption.append(species, heard);
  fig.append(picture, caption);
  // In panel mode the plate is shown by layoutPanel(), once it has a place.
  if (!panelStyle) {
    requestAnimationFrame(() => requestAnimationFrame(() => fig.classList.add("shown")));
  }
  return fig;
}

async function refresh() {
  let data;
  try {
    const res = await fetch("/api/live");
    if (!res.ok) return;
    data = await res.json();
  } catch { return; } // server briefly away; keep the current wall
  const liveFiles = new Set(data.paintings.map(p => p.file));

  for (const [file, el] of plates) {
    if (!liveFiles.has(file)) {
      plates.delete(file);
      // A bird leaving the wall takes its song with it.
      if (nowPlaying && nowPlaying.fig === el) {
        nowPlaying.audio.pause();
        nowPlaying = null;
      }
      el.classList.add("dying");
      setTimeout(() => el.remove(), FADE_MS);
    }
  }
  // Payload is newest-first; index 0 = newest = center of the collage.
  liveOrder = data.paintings.map(p => p.file);
  for (const p of data.paintings) {
    if (!plates.has(p.file)) {
      const el = makePlate(p);
      plates.set(p.file, el);
      wall.appendChild(el);
    }
    // The caption is a fixed timestamp, so it never needs re-rendering.
  }
  layoutAll(); // existing plates glide to new collision-free spots
  empty.classList.toggle("hidden", plates.size > 0);
}

refresh();
setInterval(refresh, 5000);

// ---- archive overlay (browser only; /wall.png renders none of this) ----
const archivePanel = document.getElementById("archive");
const archiveGrid = document.getElementById("archive-grid");
const archiveMore = document.getElementById("archive-more");
let archiveOffset = 0;
let archiveLoading = false; // double-clicking "more" must not duplicate cards

function whenText(bornAt) {
  const t = new Date(bornAt * 1000);
  return `${t.getDate()} ${t.toLocaleString([], { month: "short" })}, ` +
    t.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
}

async function loadArchivePage() {
  if (archiveLoading) return;
  archiveLoading = true;
  let data;
  try {
    const res = await fetch(`/api/archive?offset=${archiveOffset}&limit=60`);
    if (!res.ok) return;
    data = await res.json();
  } catch {
    return;
  } finally {
    archiveLoading = false;
  }
  for (const p of data.paintings) {
    const card = document.createElement("figure");
    card.className = "arch-card";
    const img = document.createElement("img");
    img.src = `/images/${encodeURIComponent(p.file)}`;
    img.alt = `Painting of ${p.species_common}`;
    img.loading = "lazy";
    const cap = document.createElement("figcaption");
    const species = document.createElement("div");
    species.className = "species";
    species.textContent = p.species_common;
    const when = document.createElement("div");
    when.className = "when";
    when.textContent = whenText(p.born_at);
    cap.append(species, when);
    card.append(img, cap);
    if (p.audio) {
      card.classList.add("has-audio");
      card.title = "click to hear the song that painted this bird";
      card.addEventListener("click", () => playClip(card, p.audio));
    }
    archiveGrid.appendChild(card);
  }
  archiveOffset += data.paintings.length;
  archiveMore.classList.toggle("done", archiveOffset >= data.total);
}

document.getElementById("archive-button").addEventListener("click", () => {
  archivePanel.classList.add("open");
  if (archiveOffset === 0) loadArchivePage();
});
document.getElementById("archive-close").addEventListener("click", () => {
  archivePanel.classList.remove("open");
  if (nowPlaying) { nowPlaying.audio.pause(); nowPlaying.fig.classList.remove("playing"); nowPlaying = null; }
});
archiveMore.addEventListener("click", loadArchivePage);
</script>
</body>
</html>
